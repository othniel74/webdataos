[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "webdata-gateway"
version = "0.1.0"
description = "Python SDK for the Self-Healing Web Data Gateway for AI agents and LLM workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NOVTIA" }]
dependencies = ["httpx>=0.27.0"]
keywords = ["bright-data", "web-data", "ai-agents", "rag", "scraping", "sdk"]

[project.urls]
Homepage = "https://github.com/othnielObasi"
Documentation = "https://github.com/othnielObasi"

[tool.hatch.build.targets.wheel]
packages = ["webdata_gateway"]
