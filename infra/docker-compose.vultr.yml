services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      APP_ENV: production

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production

  web:
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
        VITE_API_KEY: ${VITE_API_KEY:-dev-local-key-change-me}

  nginx:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
