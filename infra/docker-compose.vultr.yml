services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  web:
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost}
        VITE_API_KEY: ${VITE_API_KEY:-dev-local-key-change-me}

  nginx:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
