services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      TRUSTED_HOSTS: localhost,127.0.0.1,api,web,45.77.89.209,*.vercel.app

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      TRUSTED_HOSTS: localhost,127.0.0.1,api,web,45.77.89.209,*.vercel.app

  web:
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
        VITE_API_KEY: ${VITE_API_KEY:-dev-local-key-change-me}

  cognee-ui:
    restart: unless-stopped

  nginx:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
