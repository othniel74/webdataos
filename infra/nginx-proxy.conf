server {
    listen 80;
    server_name webdataos.nov-tia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name webdataos.nov-tia.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;
    set $web_upstream web:3000;
    set $cognee_upstream cognee-ui:3200;

    ssl_certificate /etc/letsencrypt/live/webdataos.nov-tia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webdataos.nov-tia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API
    location /api/ {
        proxy_pass http://$api_upstream/;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public SPA demo route. Demo API endpoints remain under /demo/* below.
    location = /demo {
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Direct API access (for SDK clients)
    location ~ ^/(health|ready|auth|workspaces|agent|gateway|intelligence|transcriptions|memory|workflows|runs|context|actions|outcomes|metrics|llm|graph|monitor|chat|triggerware|demo|portfolio|integrations|speech|admin) {
        proxy_pass http://$api_upstream;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cognee Local UI
    location /cognee/ {
        proxy_pass http://$cognee_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /_next/ {
        proxy_pass http://$cognee_upstream/_next/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Web UI (everything else)
    location / {
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
